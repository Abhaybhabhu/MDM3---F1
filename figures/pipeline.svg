<svg width="100%" viewBox="0 0 770 680" role="img">
  <title>F1 tyre health pipeline schematic</title>
  <desc>A schematic showing how observed telemetry inputs pass through physics equations to estimate latent tyre health, which then drives lap time prediction via a machine learning model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- SECTION LABEL: Observed inputs -->
  <text font-family="sans-serif" font-size="12" x="60" y="30" text-anchor="middle" fill="#AAAAAA">Observed inputs</text>

  <!-- Input boxes -->
  <rect x="10" y="40" width="100" height="44" rx="6" fill="#2C2C2C" stroke="#E10600" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="60" y="56" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">Lap time</text>
  <text font-family="sans-serif" font-size="12" x="60" y="72" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">GPS / timing</text>

  <rect x="10" y="96" width="100" height="44" rx="6" fill="#2C2C2C" stroke="#E10600" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="60" y="112" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">Sector times</text>
  <text font-family="sans-serif" font-size="12" x="60" y="128" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">split timing</text>

  <rect x="10" y="152" width="100" height="44" rx="6" fill="#2C2C2C" stroke="#E10600" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="60" y="168" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">Compound</text>
  <text font-family="sans-serif" font-size="12" x="60" y="184" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">soft / med / hard</text>

  <rect x="10" y="208" width="100" height="44" rx="6" fill="#2C2C2C" stroke="#E10600" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="60" y="224" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">Tyre age</text>
  <text font-family="sans-serif" font-size="12" x="60" y="240" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">laps on rubber</text>

  <rect x="10" y="264" width="100" height="44" rx="6" fill="#2C2C2C" stroke="#E10600" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="60" y="280" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">Fuel load</text>
  <text font-family="sans-serif" font-size="12" x="60" y="296" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">estimated kg</text>

  <!-- Arrows: inputs to physics box -->
  <line x1="110" y1="62" x2="178" y2="165" stroke="#AAAAAA" stroke-width="0.8" marker-end="url(#arrow)" fill="none"/>
  <line x1="110" y1="118" x2="178" y2="168" stroke="#AAAAAA" stroke-width="0.8" marker-end="url(#arrow)" fill="none"/>
  <line x1="110" y1="174" x2="178" y2="172" stroke="#AAAAAA" stroke-width="0.8" marker-end="url(#arrow)" fill="none"/>
  <line x1="110" y1="230" x2="178" y2="178" stroke="#AAAAAA" stroke-width="0.8" marker-end="url(#arrow)" fill="none"/>
  <line x1="110" y1="286" x2="178" y2="184" stroke="#AAAAAA" stroke-width="0.8" marker-end="url(#arrow)" fill="none"/>

  <!-- PHYSICS ENGINE BOX -->
  <rect x="180" y="110" width="148" height="120" rx="8" fill="#2C2C2C" stroke="#4A90D9" stroke-width="1.2"/>
  <text font-family="sans-serif" font-size="12" x="254" y="102" text-anchor="middle" fill="#AAAAAA">Physics-informed</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="254" y="148" text-anchor="middle" dominant-baseline="central" fill="#4A90D9">Physics engine</text>
  <text font-family="sans-serif" font-size="12" x="254" y="168" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">Degradation model</text>
  <text font-family="sans-serif" font-size="12" x="254" y="183" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">Thermal equations</text>
  <text font-family="sans-serif" font-size="12" x="254" y="198" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">Wear rate</text>

  <!-- Arrow: physics to latent -->
  <line x1="328" y1="170" x2="392" y2="170" stroke="#4A90D9" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <!-- LATENT VARIABLE BOX -->
  <rect x="394" y="108" width="148" height="124" rx="8" fill="#1A1A1A" stroke="#00B4A6" stroke-width="1.8" stroke-dasharray="6 3"/>
  <rect x="436" y="100" width="64" height="18" rx="9" fill="#00B4A6"/>
  <text font-family="sans-serif" font-size="12" font-weight="500" x="468" y="113" text-anchor="middle" dominant-baseline="central" fill="#1A1A1A">latent</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="468" y="150" text-anchor="middle" dominant-baseline="central" fill="#00B4A6">Tyre health</text>
  <text font-family="sans-serif" font-size="12" x="468" y="168" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">estimated state</text>
  <text font-family="sans-serif" font-size="12" x="468" y="184" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">not directly</text>
  <text font-family="sans-serif" font-size="12" x="468" y="199" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">observable</text>

  <!-- Arrow: latent to ML -->
  <line x1="542" y1="170" x2="602" y2="170" stroke="#00B4A6" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>

  <!-- ML MODEL BOX -->
  <rect x="604" y="110" width="68" height="120" rx="8" fill="#2C2C2C" stroke="#4A90D9" stroke-width="1"/>
  <text font-family="sans-serif" font-size="12" x="638" y="102" text-anchor="middle" fill="#AAAAAA">Model</text>
  <text font-family="sans-serif" font-size="12" font-weight="500" x="638" y="152" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">ML</text>
  <text font-family="sans-serif" font-size="12" font-weight="500" x="638" y="168" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">model</text>



  <!-- Arrow: ML to output -->
  <line x1="638" y1="230" x2="638" y2="290" stroke="#E10600" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>

  <!-- OUTPUT BOX -->
  <rect x="590" y="292" width="96" height="56" rx="8" fill="#2C2C2C" stroke="#E10600" stroke-width="1.4"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="638" y="316" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">Lap time</text>
  <text font-family="sans-serif" font-size="12" x="638" y="334" text-anchor="middle" dominant-baseline="central" fill="#E10600">predicted</text>

  <!-- Arrow: output to strategy -->
  <line x1="638" y1="348" x2="638" y2="400" stroke="#AAAAAA" stroke-width="0.8" marker-end="url(#arrow)" fill="none"/>

  <!-- STRATEGY BOX -->
  <rect x="482" y="402" width="312" height="56" rx="8" fill="#2C2C2C" stroke="#444444" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="638" y="426" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">Strategy optimiser</text>
  <text font-family="sans-serif" font-size="12" x="638" y="444" text-anchor="middle" dominant-baseline="central" fill="#AAAAAA">Pit stop strategy</text>